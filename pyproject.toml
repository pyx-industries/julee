[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julee"
version = "0.3.0"
description = "Julee - a clean architecture framework for Python solutions"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
authors = [
    {name = "Pyx Industries", email = "chris@pyx.io"}
]
keywords = ["clean-architecture", "domain-driven-design", "bounded-context", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # The kernel itself needs only pydantic. Everything else is an extra,
    # so a solution installs the integrations and domain code it uses.
    # See docs/ADRs/012-framework-and-kits.md.
    "pydantic>=2.0.0",
]

[project.optional-dependencies]

# Doctrine, policy and code introspection
doctrine = [
    "griffe>=1.0.0,<2",
    "inflect>=7.5.0",
]

# Temporal integration
temporal = [
    "temporalio[pydantic]>=1.27.0",
]

# FastAPI applications
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.27",
    "fastapi-pagination>=0.12.0",
]

# MinIO object storage
minio = [
    "minio>=7.0.0",
]


# Everything
all = [
    "julee[doctrine,temporal,api,minio]",
]

dev = [
    # Every runtime extra, so the whole test suite runs
    "julee[all]",
    # The kits in this workspace, so their tests run too
    "julee-viewpoints",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.0.0",
    "factory-boy>=3.2.0",
    # Mutation testing (run on demand: uv run mutmut run)
    "mutmut>=3.5.0",
    # Type checking
    "mypy>=1.7.0",
    "types-PyYAML",
    "types-jsonschema",
    "types-python-dateutil",
    # Code quality
    "black>=24.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.0.0",
    # Security
    "bandit",
    # Database (for testing)
    "asyncpg",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-rtd-theme>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinxcontrib-plantuml>=0.25",
    "sphinx-autoapi>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/pyx-industries/julee"
Repository = "https://github.com/pyx-industries/julee"
Documentation = "https://github.com/pyx-industries/julee#readme"
Issues = "https://github.com/pyx-industries/julee/issues"

[tool.uv.workspace]
members = ["viewpoints"]

[tool.uv.sources]
julee-viewpoints = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["julee*"]

[tool.setuptools.package-data]
# PEP 561: julee is typed, so a solution or kit that depends on it gets
# its annotations rather than Any.
julee = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/julee", "viewpoints/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    # A hung test fails instead of holding the machine. Temporal's test
    # server needs room to start, hence the size of it.
    "--timeout=300",
    "--tb=short",
    "-n", "auto",
    "--dist", "loadgroup",
    "--cov=src/julee",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, with dependencies)",
    "e2e: End-to-end tests (slowest, full stack)",
    "llm: Tests that use real LLM API calls (slow, costs money)",
    "contract: Contract tests (verify external API shapes and mock fidelity)",
    "slow: Slow tests (stress tests, load tests)",
]

[tool.coverage.run]
source = ["src/julee"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
# Ruff is used for linting only. Formatting is handled by black.
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["julee"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "minio.*",
    "temporalio.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Recent Sphinx uses Python 3.12 syntax, which mypy rejects when checking
# for 3.11; docutils ships no stubs.
module = [
    "sphinx.*",
    "docutils.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Untyped third-party libraries with no published stubs.
module = [
    "jsonpointer",
    "multihash",
    "sphinxcontrib.plantuml",
]
ignore_missing_imports = true

[tool.julee]
# julee is itself a julee solution
search_root = "src/julee"
kits = ["viewpoints"]
docs_root = "docs"
skip_policies = ["temporal-pipelines"]  # julee core doesn't use Temporal

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.mutmut]
# Mutation testing is run on demand, not in CI: uv run mutmut run, then
# uv run mutmut results. Widen paths_to_mutate as modules gain tests worth
# measuring; the parser is first because doctrine depends on it.
paths_to_mutate = ["src/julee/core/parsers/ast.py"]
also_copy = ["src/"]
tests_dir = ["src/julee/core/parsers/tests/"]
pytest_add_cli_args = ["-x", "-q", "--tb=no", "-p", "no:xdist", "-p", "no:cacheprovider", "-o", "addopts="]
