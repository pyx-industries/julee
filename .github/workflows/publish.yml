name: Publish to PyPI

# The kits release from julee-kits; this repository publishes julee.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(uv version --short)
          if [ "$version" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match julee $declared" >&2
            exit 1
          fi

      - name: Build package
        run: uv build

      # Trusted publishing: PyPI trusts this repository and workflow, so
      # there is no token to hold or rotate. `always` rather than
      # `automatic` so a misconfigured publisher fails loudly instead of
      # falling back to looking for credentials that do not exist.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
