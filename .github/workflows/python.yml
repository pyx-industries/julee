name: Python

on:
  pull_request:
    paths:
      - "src/julee/**"
      - "viewpoints/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/python.yml"
  push:
    branches: [master]
    paths:
      - "src/julee/**"
      - "viewpoints/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: make lint-python

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check
        run: make typecheck

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test
        run: make test-python-unit

  doctrine:
    name: Doctrine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Doctrine tests
        run: make test-doctrine


  # The MinIO double checked against MinIO. Four divergences shipped
  # before this job existed (#124, #90, #285, #287), each found by a
  # downstream deployment, because nothing ran julee's assertions
  # against the real thing.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      # From the GitHub release, not a registry. MinIO withdrew its
      # public images and binaries during 2025: quay.io/minio/minio
      # answers 401 to an anonymous pull and dl.min.io answers 410.
      # The release assets are what is left that needs no account, and
      # they are checksummed, so the pin is on the bytes rather than on
      # a tag someone can move.
      - name: Start MinIO
        env:
          MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          set -euo pipefail
          url=https://github.com/minio/minio/releases/download/$MINIO_RELEASE
          curl -fsSL "$url/minio.linux-amd64.$MINIO_RELEASE" -o minio
          echo "$MINIO_SHA256  minio" | sha256sum -c -
          chmod +x minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup ./minio server /tmp/minio-data --address :9000 >minio.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not come up"; cat minio.log; exit 1

      # JULEE_REQUIRE_MINIO is what stops this job reporting success for
      # skipping everything, should the server ever fail to start.
      - name: Contract tests
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          JULEE_REQUIRE_MINIO: "1"
        run: make test-contract
