name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/julee/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/julee/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu ships PlantUML 1.2020, whose bundled C4 library is too old
      # for the C4 diagrams in docs/architecture/diagrams.
      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz
          sudo curl -fsSL -o /opt/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar
          printf '#!/bin/sh\nexec java -jar /opt/plantuml.jar "$@"\n' \
            | sudo tee /usr/local/bin/plantuml > /dev/null
          sudo chmod +x /usr/local/bin/plantuml
        env:
          PLANTUML_VERSION: "1.2026.6"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build docs
        run: make docs
